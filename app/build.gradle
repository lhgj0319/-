plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.btcarcar'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.btcarcar"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
